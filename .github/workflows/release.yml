name: Release and Publish

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and publish'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - feat/platform

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Publish to SimpleCloud Repository
        run: ./gradlew publish
        env:
          SIMPLECLOUD_USERNAME: ${{ secrets.SIMPLECLOUD_USERNAME }}
          SIMPLECLOUD_PASSWORD: ${{ secrets.SIMPLECLOUD_PASSWORD }}

      - name: Get Gradle Version
        id: gradle_version
        run: echo "GRADLE_VERSION=$(./gradlew properties -q | grep "version:" | awk '{print $2}')" >> $GITHUB_ENV

      - name: Get Commit Hash
        id: commit_hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Create Release
        run: |
          jars=()
          for jar in $(find . -type f -name "*.jar" -path "*/build/libs/*.jar" -not -path "./build/libs/*"); do
            echo "Uploading $jar"
            jars+=("$jar")
          done
          gh release create "v${GRADLE_VERSION}-dev.${COMMIT_HASH}" \
            --target "${{ inputs.branch }}" \
            --title "v${GRADLE_VERSION}-dev.${COMMIT_HASH}" \
            --notes "This release contains dev builds for all Gradle modules." \
            --prerelease \
            "${jars[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
