[versions]
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"

simplecloud-api = "0.1.0-platform.58-dev.5.1-fe01ce5"

velocity = "4.1.0-SNAPSHOT"
bungeecord = "1.21-R0.4"
paper = "26.3.build.+"
minestom = "26_3-SNAPSHOT"

adventure = "5.2.0"

configurate = "4.2.0"
slf4j = "2.0.20"

cloud = "2.1.0"
cloud-platform = "2.0.0"
cloud-minestom = "2.2.0-SNAPSHOT"

shadow = "9.6.1"

[libraries]
kotlin-jvm = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

simplecloud-api = { module = "app.simplecloud.api:api", version.ref = "simplecloud-api" }

velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
bungeecord-api = { module = "net.md-5:bungeecord-api", version.ref = "bungeecord" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
minestom = { module = "net.minestom:minestom", version.ref = "minestom" }

adventure = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-text-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-text-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }

configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
configurate-gson = { module = "org.spongepowered:configurate-gson", version.ref = "configurate" }
configurate-extra-kotlin = { module = "org.spongepowered:configurate-extra-kotlin", version.ref = "configurate" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud" }
cloud-coroutines = { module = "org.incendo:cloud-kotlin-coroutines", version.ref = "cloud" }
cloud-velocity = { module = "org.incendo:cloud-velocity", version.ref = "cloud-platform" }
cloud-bungee = { module = "org.incendo:cloud-bungee", version.ref = "cloud-platform" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-platform" }
cloud-minestom = { module = "org.incendo:cloud-minestom", version.ref = "cloud-minestom" }

kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
shadow-gradle-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }

[bundles]
adventure = ["adventure", "adventure-text-minimessage"]
configurate = ["configurate-yaml", "configurate-gson", "configurate-extra-kotlin"]
cloud = ["cloud-core", "cloud-coroutines"]

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }